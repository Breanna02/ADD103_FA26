<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Javascript Photo Gallery</title>
</head>
<body>
    <!-- Alt text generated by AI -->
    <div class="gallery-container">
        <figure class="main-display">
            <img id="large" src="images/thumb1.png" alt="Minecraft character in a hallway beside a large stopwatch graphic and the words Wins equals question marks">
            <figcaption id="caption">A thumbnail I made for a minecraft murder mystery 1 hour challenge video</figcaption>
        </figure>

        <section class="thumbnail-grid" aria-label="Choose a Minecraft gaming image">
            <button class="thumb" type="button" onclick="change('images/thumb1.png', 'A thumbnail I made for a minecraft murder mystery 1 hour challenge video')">
                <img src="images/thumb1.png" alt="Minecraft character in a hallway beside a large stopwatch graphic and the words Wins equals question marks">
            </button>
            <button class="thumb" type="button" onclick="change('images/thumb2.png', 'A thumbnail I made regarding a recent life update')">
                <img src="images/thumb2.png" alt="Minecraft character standing on an icy ledge beneath the words It’s been rough">
            </button>
            <button class="thumb" type="button" onclick="change('images/thumb3.png', 'A video thumbnail for 1 hour of uncut murder mystery gameplay')">
                <img src="images/thumb3.png" alt="Minecraft character holding a diamond sword beside a keyboard and gaming mouse">
            </button>
            <button class="thumb" type="button" onclick="change('images/thumb4.png', 'A thumbnail for a murder mystery challenge video')">
                <img src="images/thumb4.png" alt="Minecraft character walking through a stone hallway as another character follows with a sword">
            </button>
            <button class="thumb" type="button" onclick="change('images/thumb5.png', 'A thumbnail for a video about a hard Minecraft challenge')">
                <img src="images/thumb5.png" alt="Minecraft character surrounded by zombies in a forest clearing">
            </button>
        </section>
        <section class="color-picker" aria-labelledby="color-picker-title">
            <h2 id="color-picker-title">Select a mode</h2>
            <div class="color-buttons">
                <button type="button" data-theme-choice="light" aria-pressed="true" onclick="setBgColor('light')">Light mode</button>
                <button type="button" data-theme-choice="dark" aria-pressed="false" onclick="setBgColor('dark')">Dark mode</button>
            </div>
        </section>

        <footer>
            <p>&copy; Created by Breanna Calixto</p>
            <a href="../../index.html">Back to Student Portal</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
