<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grid Container</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="hero-text">
                <h1>In A Galaxy Far, Far Away</h1>
                <p>From desert planets to distant galaxies, explore the worlds and characters of the Star Wars universe.</p>
            </div>
            <img class="hero-image" src="images/Flight_Hanger.jpg" alt="The Millennium Falcon parked inside of a flight hanger">
        </header>

        <div class="photo-wall">
            <img src="images/Tatooine_Mandalorian.jpg" alt="The Mandalorian on the planet Tatooine">
            <img src="images/Millennium_Falcon_Interior.jpg" alt="Interior of the Millennium Falcon">
            <img src="images/Tatooine.jpg" alt="R2-D2 and C-3PO walking on Tatooine">
            <img src="images/Grogu_Forest.jpg" alt="Grogu wandering through a forest">
            <img src="images/Kylo_Ren_Distant_Planet.jpg" alt="Kylo Ren on dark planet">
            <img src="images/Stormtroopers.jpg" alt="A group of Stormtroopers">
        </div>

        <footer>
            <p>Created by Breanna Calixto. Images from <a href="https://unsplash.com/">Unsplash</a></p>
            <a href="../../index.html">Back to Student Portal</a>
        </footer>
    </div>
</body>
</html>
