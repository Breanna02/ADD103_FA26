<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanning & Grid Areas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="hero-banner">
                <div class="hero">
                    <h1>The Beauty of Nature</h1>
                    <p>Mountains, fields, wildlife, and much more!</p>
                </div>
                <img src="images/hero.jpg" alt="Hero image for recent projects">
            </div>
        </header>

        <main class="gallery-shell">
            <section class="gallery-container" aria-label="Project gallery">
                <div class="main-display">
                    <img src="images/thumb1.jpg" alt="Featured project preview">
                </div>

                <div class="thumb thumb-1">
                    <img src="images/thumb1.jpg" alt="Project thumbnail 1">
                </div>
                <div class="thumb thumb-2">
                    <img src="images/thumb2.jpg" alt="Project thumbnail 2">
                </div>
                <div class="thumb thumb-3">
                    <img src="images/thumb3.jpg" alt="Project thumbnail 3">
                </div>
                <div class="thumb thumb-4">
                    <img src="images/thumb4.jpg" alt="Project thumbnail 4">
                </div>
                <div class="thumb thumb-5">
                    <img src="images/thumb5.jpg" alt="Project thumbnail 5">
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>Created by Breanna Calixto. Images from Unsplash</p>
        </footer>
    </div>
</body>
</html>
